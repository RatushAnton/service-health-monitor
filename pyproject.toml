[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-health-monitor"
version = "0.1.0"
description = "Home network and service health monitoring CLI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "dnspython>=2.6,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff",
]

[project.scripts]
healthmon = "healthmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthmon = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
]