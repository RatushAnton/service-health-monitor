<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex,nofollow">
        <title>Add monitor · Service Health Monitor</title>
        <link rel="stylesheet" href="/admin/assets/admin.css">
    </head>
    <body>
        <header class="topbar">
            <div>
                <p class="eyebrow">SERVICE HEALTH MONITOR</p>
                <h1>Add monitor</h1>
            </div>
            <a class="secondary link-button" href="/admin/monitors">Back</a>
        </header>

        <main class="container form-container">
            <div class="panel">
                <p class="muted">Select the monitoring protocol:</p>
                <div class="actions">
                    <a class="secondary link-button" href="/admin/monitors/new?type=dns">DNS</a>
                    <a class="secondary link-button" href="/admin/monitors/new?type=tcp">TCP</a>
                    <a class="secondary link-button" href="/admin/monitors/new?type=http">HTTP</a>
                </div>

                {% if error %}
                <p class="alert" role="alert">{{ error }}</p>
                {% endif %}

                <form method="post" action="/admin/monitors/new">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="type" value="{{ monitor.type }}">

                    <label for="id">Monitor ID</label>
                    <input id="id" name="id" required maxlength="64"
                        pattern="[A-Za-z0-9][A-Za-z0-9_-]*"
                        value="{{ monitor.get('id', '') }}"
                        placeholder="my_service">

                    <label for="name">Display name</label>
                    <input id="name" name="name" required maxlength="100"
                        value="{{ monitor.get('name', '') }}"
                        placeholder="My Service">

                    {% if monitor.type == 'dns' %}
                    <label for="host">DNS hostname</label>
                    <input id="host" name="host" required maxlength="253"
                        value="{{ monitor.get('host', '') }}"
                        placeholder="example.com">

                    <label for="record_type">Record type</label>
                    <select id="record_type" name="record_type">
                        <option value="A" {% if monitor.get('record_type', 'A') == 'A' %}selected{% endif %}>A</option>
                        <option value="AAAA" {% if monitor.get('record_type') == 'AAAA' %}selected{% endif %}>AAAA</option>
                    </select>

                    <label for="resolver">Resolver (optional)</label>
                        <input id="resolver" name="resolver"
                            value="{{ monitor.get('resolver', '') }}"
                            placeholder="system or resolver IP">

                    {% elif monitor.type == 'tcp' %}
                    <label for="host">Hostname or IP</label>
                    <input id="host" name="host" required maxlength="253"
                        value="{{ monitor.get('host', '') }}"
                        placeholder="example.com">

                    <label for="port">TCP port</label>
                    <input id="port" name="port" type="number"
                        min="1" max="65535" required
                        value="{{ monitor.get('port', '') }}"
                        placeholder="443">

                    {% elif monitor.type == 'http' %}
                    <label for="url">HTTP URL</label>
                        <input id="url" name="url" type="url" required maxlength="2048"
                        value="{{ monitor.get('url', '') }}"
                        placeholder="https://example.com">

                    <label for="expected_status">Expected status</label>
                    <input id="expected_status" name="expected_status"
                        type="number" min="100" max="599" required
                        value="{{ monitor.get('expected_status', 200) }}">
                    {% endif %}

                    <div class="actions">
                        <button class="primary" type="submit">Create monitor</button>
                        <a class="secondary link-button" href="/admin/monitors">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
