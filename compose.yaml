name: service-health-monitor

services:
  registry-init:
    image: service-health-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - worker

    entrypoint:
      - python
      - -m
      - healthmon.registry

    command:
      - --config
      - /etc/healthmon/targets.yaml
      - --db
      - /var/lib/service-health-monitor/health.db

    volumes:
      - ./deploy/docker/targets.yaml:/etc/healthmon/targets.yaml:ro
      - monitor_worker_data:/var/lib/service-health-monitor

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    restart: "no"

  healthmon:
    image: service-health-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - manual

    command:
      - check
      - --config
      - /etc/healthmon/targets.yaml
      - --db
      - /var/lib/service-health-monitor/health.db

    volumes:
      - ./deploy/docker/targets.yaml:/etc/healthmon/targets.yaml:ro
      - monitor_test_data:/var/lib/service-health-monitor

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  worker:
    image: service-health-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      registry-init:
        condition: service_completed_successfully

    profiles:
      - worker

    entrypoint:
      - python
      - -m
      - healthmon.worker

    command:
      - --source
      - db
      - --db
      - /var/lib/service-health-monitor/health.db
      - --interval
      - "300"

    volumes:
      - monitor_worker_data:/var/lib/service-health-monitor

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    image: service-health-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - web

    entrypoint:
      - python
      - -m
      - uvicorn
      - healthmon.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    environment:
      HEALTHMON_DB_PATH: /var/lib/service-health-monitor/health.db

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - monitor_worker_data:/var/lib/service-health-monitor:ro

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    init: true
    restart: unless-stopped

  admin:
    image: service-health-monitor:local
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - admin

    entrypoint:
      - python
      - -m
      - uvicorn
      - healthmon.admin_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"

    environment:
      HEALTHMON_DB_PATH: /var/lib/service-health-monitor/health.db
      HEALTHMON_ADMIN_TOKEN_FILE: /run/secrets/healthmon_admin_token

    ports:
      - "127.0.0.1:8081:8081"

    secrets:
      - healthmon_admin_token

    volumes:
      - monitor_worker_data:/var/lib/service-health-monitor

    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    init: true
    restart: unless-stopped

secrets:
  healthmon_admin_token:
    file: ./deploy/local/admin-token.txt

volumes:
  monitor_test_data:
  monitor_worker_data:
