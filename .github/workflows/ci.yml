name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check Python compilation
        run: python -m compileall -q src tests

      - name: Ruff lint
        run: ruff check src/healthmon tests

      - name: Ruff formatting
        run: ruff format --check src/healthmon tests

      - name: Run automated tests
        run: python -m pytest -v

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare example configuration
        run: cp deploy/docker/targets.example.yaml deploy/docker/targets.yaml

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build worker

      - name: Verify non-root image
        run: |
          test "$(docker image inspect service-health-monitor:local --format '{{.Config.User}}')" = "10001:10001"

      - name: Verify container commands
        run: |
          docker run --rm service-health-monitor:local --help
          docker run --rm --entrypoint python service-health-monitor:local -m healthmon.worker --help
      
      - name: Verify packaged dashboard assets
        run: |
          docker run --rm \
            --entrypoint python \
            service-health-monitor:local \
            -c 'from importlib.resources import files; p = files("healthmon"); assert all((p / x).is_file() for x in ("templates/dashboard.html", "static/dashboard.css", "static/dashboard.js"))'

